<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/logo-amnayar.png"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/ai.css"><title>داشبورد | امنا یار AI</title></head><body class="dash"><aside class="sidebar"><a class="brand" href="/"><img src="/assets/logo-amnayar.png"><span>امنا یار AI<small>دستیار هوشمند</small></span></a><button class="new-chat" onclick="newChat()">＋ گفت‌وگوی جدید</button><div class="side-label">گفت‌وگوهای اخیر</div><div id="conversationList" class="conversation-list"></div><div class="side-bottom"><a href="/">صفحه اصلی</a><button onclick="logout()">خروج</button></div></aside><main class="chat-main"><header class="chat-head"><div><b id="chatTitle">گفت‌وگوی جدید</b><span id="status">آماده • هوش مصنوعی روی دستگاه شما</span></div><div class="head-actions"><span id="usernameBadge" class="plan-badge username-badge hidden"></span><span class="ai-public-badge">دستیار هوشمند امنا یار</span><a id="ownerLink" class="owner-link hidden" href="/owner">پنل مالک</a></div></header><section id="messages" class="messages"><div class="welcome"><img src="/assets/logo-amnayar.png"><h1>سلام 👋 من امنا یار AI هستم.</h1><p>سؤالتان را بنویسید، ایده بخواهید، متن بدهید یا تصویر ارسال کنید.</p><div class="suggestions"><button onclick="useSuggestion('برای یک کسب‌وکار کوچک یک برنامه بازاریابی ۳۰ روزه بساز.')">برنامه بازاریابی بساز</button><button onclick="useSuggestion('یک متن رسمی و حرفه‌ای برای معرفی خدمات شرکت بنویس.')">متن حرفه‌ای بنویس</button><button onclick="useSuggestion('سه ایده درآمدی عملی و کم‌هزینه پیشنهاد بده.')">ایده درآمدی بده</button></div></div></section><div id="imagePreview" class="image-preview hidden"></div><form id="composer" class="composer" onsubmit="sendMessage(event)"><input type="file" id="imageInput" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.csv,.txt,.md,.json,.xml,.zip,.py,.js,.ts,.html,.css,.sql,.java,.cpp,.c,.cs,.go,.rs,.rb,.php,.mp3,.wav,.m4a,.ogg,.flac,.aac,.mp4,.mov,.mkv,.avi,.webm" multiple hidden><button type="button" class="attach" onclick="document.getElementById('imageInput').click()" title="پیوست فایل">＋</button><textarea id="messageInput" rows="1" placeholder="پیام خود را بنویسید…" onkeydown="handleKey(event)"></textarea><button class="send" type="submit">↑</button></form></main><script src="/ai.js"></script></body></html>
