<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>داشبورد | امنا یار</title></head><body><header class="nav"><a class="brand" href="/"><img src="/assets/logo-amnayar.png"><span>امنا یار<small>داشبورد کاربر</small></span></a><div class="nav-actions"><a class="btn ghost" href="/#pricing">خرید اعتبار</a><button class="btn primary" onclick="logout()">خروج</button></div></header><main class="dash"><div class="dash-grid"><aside class="panel"><h3 id="name">در حال بارگذاری...</h3><p id="email" class="muted"></p><div class="stat"><small>اعتبار باقی‌مانده</small><b id="credits">—</b></div><hr><button class="btn primary full" onclick="check('national')">استعلام کد ملی</button><br><button class="btn primary full" onclick="check('card')">استعلام کارت</button><br><button class="btn primary full" onclick="check('iban')">استعلام شبا</button></aside><section class="panel"><h2>خوش آمدید</h2><p class="muted">هر استعلام یک اعتبار مصرف می‌کند.</p><div id="result"></div><h3>سوابق اخیر</h3><table class="table"><thead><tr><th>نوع</th><th>نتیجه</th><th>تاریخ</th></tr></thead><tbody id="history"></tbody></table></section></div></main><script>async function api(u,o){const r=await fetch(u,o);return r.json()}async function load(){const r=await api('/api/dashboard');if(r.error)return location.href='/';document.getElementById('name').textContent=r.user.username;document.getElementById('email').textContent=r.user.email;document.getElementById('credits').textContent=r.user.credits;document.getElementById('history').innerHTML=r.checks.map(x=>`<tr><td>${x.kind}</td><td>${x.result}</td><td>${new Date(x.created_at).toLocaleString('fa-IR')}</td></tr>`).join('')}async function check(kind){const labels={national:'کد ملی',card:'شماره کارت',iban:'شماره شبا'};const input=prompt(labels[kind]+' را وارد کنید:');if(!input)return;const r=await api('/api/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind,input})});alert(r.error||`نتیجه: ${r.result}`);load()}async function logout(){await api('/api/auth/logout',{method:'POST'});location.href='/'}load()</script></body></html>
