<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>داشبورد | امنا یار</title></head><body><header class="nav"><a class="brand" href="/"><img src="/assets/logo-amnayar.png"><span>امنا یار<small>داشبورد کاربر</small></span></a><div class="nav-actions"><span id="topUsername" class="user-chip">کاربر</span><a class="btn soft" href="/#services">خدمات</a><button class="btn primary" onclick="logout()">خروج</button></div></header><main class="dash"><div class="dash-grid"><aside class="panel"><h3 id="name">در حال بارگذاری...</h3><p id="email" class="muted"></p><div class="stat"><small>وضعیت خدمات</small><b>رایگان</b></div><div class="stat"><small>اعتبار</small><b>بدون نیاز به خرید</b></div><hr><button class="btn primary full" onclick="check('national')">استعلام کد ملی</button><br><button class="btn primary full" onclick="check('card')">استعلام کارت</button><br><button class="btn primary full" onclick="check('iban')">استعلام شبا</button><br><button class="btn soft full" onclick="openExtra()">سایر استعلام‌ها</button></aside><section class="panel"><h2>خوش آمدید</h2><p class="muted">خدمات رایگان ساختاری امنا یار را بدون خرید اعتبار استفاده کنید.</p><div id="result"></div><div id="extra" style="display:none;margin-top:20px"><h3>سایر استعلام‌های رایگان</h3><div class="feature-grid"><button class="panel" onclick="localCheck('company')"><h3>شناسه ملی شرکت</h3><p>بررسی قالب و رقم کنترلی</p></button><button class="panel" onclick="localCheck('postal')"><h3>کد پستی</h3><p>بررسی ۱۰ رقم</p></button><button class="panel" onclick="localCheck('mobile')"><h3>شماره موبایل</h3><p>بررسی قالب و اپراتور</p></button><button class="panel" onclick="localCheck('tracking')"><h3>کد رهگیری پستی</h3><p>بررسی قالب</p></button><button class="panel" onclick="localCheck('vin')"><h3>VIN خودرو</h3><p>بررسی ۱۷ کاراکتر</p></button><button class="panel" onclick="localCheck('plate')"><h3>پلاک خودرو</h3><p>بررسی قالب پلاک ایران</p></button><button class="panel" onclick="localCheck('sayadi')"><h3>شناسه صیادی</h3><p>بررسی ۱۶ رقم</p></button><button class="panel" onclick="localCheck('account')"><h3>شماره حساب</h3><p>بررسی قالب عددی</p></button></div></div><h3>سوابق اخیر</h3><table class="table"><thead><tr><th>نوع</th><th>نتیجه</th><th>تاریخ</th></tr></thead><tbody id="history"></tbody></table></section></div></main><script>
async function api(u,o){const r=await fetch(u,o);return r.json()}
async function load(){const r=await api('/api/dashboard');if(r.error)return location.href='/';document.getElementById('name').textContent=r.user.username;document.getElementById('email').textContent=r.user.email;document.getElementById('topUsername').textContent=r.user.username;document.getElementById('history').innerHTML=r.checks.map(x=>`<tr><td>${x.kind}</td><td>${x.result}</td><td>${new Date(x.created_at).toLocaleString('fa-IR')}</td></tr>`).join('');const k=new URLSearchParams(location.search).get('check');if(k)check(k)}
async function check(kind){const labels={national:'کد ملی',card:'شماره کارت',iban:'شماره شبا'};const input=prompt(labels[kind]+' را وارد کنید:');if(!input)return;let city='';if(kind==='national')city=prompt('نام شهر صادرکننده کارت ملی را وارد کنید:')||'';const r=await api('/api/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind,input,city})});if(r.error)return alert(r.error);let message=`نتیجه: ${r.result}`;if(kind==='national')message+=`
شهر صادرکننده کارت ملی: ${r.details?.issuingCity||'ثبت نشده'}`;if(kind==='card')message+=`
نام بانک: ${r.details?.bankName||'نامشخص'}`;if(kind==='iban')message+=`
نام بانک: ${r.details?.bankName||'نامشخص'}
کد بانک: ${r.details?.bankCode||'—'}
شماره حساب: ${r.details?.accountNumber||'—'}`;alert(message);load()}
function openExtra(){const x=document.getElementById('extra');x.style.display=x.style.display==='none'?'block':'none'}
function normalize(v){return String(v||'').replace(/[\s-]/g,'').replace(/[۰-۹]/g,d=>String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)))}
function luhn(v){let s=0,alt=false;for(let i=v.length-1;i>=0;i--){let n=+v[i];if(alt){n*=2;if(n>9)n-=9}s+=n;alt=!alt}return s%10===0}
function national(v){v=normalize(v);if(!/^\d{10}$/.test(v)||/^([0-9]){9}$/.test(v))return false;let sum=0;for(let i=0;i<9;i++)sum+=+v[i]*(10-i);let r=sum%11;return r<2?+v[9]===r:+v[9]===11-r}
function company(v){v=normalize(v);if(!/^\d{11}$/.test(v)||/^([0-9]){10}$/.test(v))return false;let sum=0;for(let i=0;i<10;i++)sum+=+v[i]*(11-i);let r=sum%11;return r<2?+v[10]===r:+v[10]===11-r}
function localCheck(kind){const prompts={company:'شناسه ملی شرکت ۱۱ رقمی',postal:'کد پستی ۱۰ رقمی',mobile:'شماره موبایل ایران',tracking:'کد رهگیری پستی',vin:'VIN خودرو ۱۷ کاراکتری',plate:'پلاک خودرو را وارد کنید',sayadi:'شناسه صیادی ۱۶ رقمی',account:'شماره حساب بانکی'};let v=prompt(prompts[kind]);if(!v)return;v=normalize(v);let ok=false,detail='';if(kind==='company'){ok=company(v);detail='شناسه ملی از نظر ساختاری بررسی شد.'}if(kind==='postal'){ok=/^\d{10}$/.test(v)&&!/^0+$/.test(v);detail='کد پستی باید ۱۰ رقم باشد.'}if(kind==='mobile'){ok=/^09\d{9}$/.test(v);detail='قالب شماره همراه ایران بررسی شد.'}if(kind==='tracking'){ok=/^\d{24}$/.test(v);detail='کد رهگیری پستی معمولاً ۲۴ رقم است.'}if(kind==='vin'){ok=/^[A-HJ-NPR-Z0-9]{17}$/i.test(v);detail='VIN باید ۱۷ کاراکتر و بدون I/O/Q باشد.'}if(kind==='plate'){ok=/^\d{2}[آ-یA-Za-z]\d{3}\d{2}$/.test(v.replace(/\s/g,''));detail='قالب پلاک به‌صورت ساده بررسی شد.'}if(kind==='sayadi'){ok=/^\d{16}$/.test(v)&&!/^0+$/.test(v);detail='شناسه صیادی باید ۱۶ رقم باشد.'}if(kind==='account'){ok=/^\d{8,19}$/.test(v);detail='طول عددی شماره حساب بررسی شد.'}alert((ok?'معتبر':'نامعتبر')+'
'+detail+'

توجه: این ابزار فقط صحت ساختاری را بررسی می‌کند و جای استعلام رسمی مالکیت/سوابق نیست.')}async function logout(){await api('/api/auth/logout',{method:'POST'});location.href='/'}load();</script></body></html>
