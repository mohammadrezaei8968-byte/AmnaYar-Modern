<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>داشبورد | امنا یار</title></head><body><header class="nav"><a class="brand" href="/"><img src="/assets/logo-amnayar.png"><span>امنا یار<small>داشبورد کاربر</small></span></a><div class="nav-actions"><span id="topUsername" class="user-chip">کاربر</span><a class="btn soft" href="/ai.html">هوش مصنوعی امنا یار</a><button class="btn primary" onclick="logout()">خروج</button></div></header><main class="dash"><div class="dash-grid"><aside class="panel"><h3 id="name">در حال بارگذاری...</h3><p id="email" class="muted"></p><div class="stat"><small>استعلام</small><b>رایگان و نامحدود</b></div><div class="stat"><small>اشتراک AI</small><b id="plan">در حال بررسی…</b><a class="btn soft full" href="/pricing.html" style="margin-top:10px">ارتقای اشتراک</a></div><hr><button class="btn primary full" onclick="check('national')">استعلام کد ملی</button><br><button class="btn primary full" onclick="check('card')">استعلام کارت</button><br><button class="btn primary full" onclick="check('iban')">استعلام شبا</button><br><a class="btn soft full" href="/ai.html">رفتن به هوش مصنوعی</a></aside><section class="panel"><h2>خوش آمدید</h2><p class="muted">تمام استعلام‌های ساختاری این نسخه رایگان و بدون محدودیت اعتباری هستند.</p><div id="result"></div><h3>سوابق اخیر</h3><table class="table"><thead><tr><th>نوع</th><th>نتیجه</th><th>تاریخ</th></tr></thead><tbody id="history"></tbody></table></section></div></main><script>async function api(u,o){const r=await fetch(u,o);return r.json()}async function load(){const r=await api('/api/dashboard');if(r.error)return location.href='/';document.getElementById('name').textContent=r.user.username;document.getElementById('email').textContent=r.user.email;const me=await api('/api/me');if(!me.error){document.getElementById('topUsername').textContent=me.user.username;document.getElementById('plan').textContent=`${me.plan.name} · ${me.plan.messagesUsed}/${me.plan.messagesLimit} پیام امروز`;};document.getElementById('history').innerHTML=r.checks.map(x=>`<tr><td>${x.kind}</td><td>${x.result}</td><td>${new Date(x.created_at).toLocaleString('fa-IR')}</td></tr>`).join('');const k=new URLSearchParams(location.search).get('check');if(k)check(k)}async function check(kind){const labels={national:'کد ملی',card:'شماره کارت',iban:'شماره شبا'};if(!labels[kind])return;const input=prompt(labels[kind]+' را وارد کنید:');if(!input)return;const r=await api('/api/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind,input})});alert(r.error||`نتیجه: ${r.result}`);load()}async function logout(){await api('/api/auth/logout',{method:'POST'});location.href='/'}load()</script></body></html>
