<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>پنل مالک | امنا یار</title></head><body><header class="nav"><a class="brand" href="/"><img src="/assets/logo-amnayar.png"><span>امنا یار<small>پنل مالک</small></span></a><div class="nav-actions"><button class="btn primary" onclick="logout()">خروج</button></div></header><main class="dash"><div class="panel"><div class="stat-grid"><div class="stat"><small>کاربران</small><b id="users">—</b></div><div class="stat"><small>سفارش‌ها</small><b id="orders">—</b></div><div class="stat"><small>استعلام‌ها</small><b id="checks">—</b></div></div><p><a class="btn primary" href="/api/owner/export.xlsx">دریافت گزارش Excel</a></p></div><div class="panel" style="margin-top:20px"><h2>سفارش‌های خرید اعتبار</h2><table class="table"><thead><tr><th>کاربر</th><th>بسته</th><th>مبلغ</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody id="list"></tbody></table></div></main><script>async function api(u,o){const r=await fetch(u,o);return r.json()}async function load(){const s=await api('/api/owner/stats');if(s.error)return location.href='/';users.textContent=s.users;orders.textContent=s.orders;checks.textContent=s.checks;const r=await api('/api/owner/orders');list.innerHTML=r.orders.map(o=>`<tr><td>${o.username}<br>${o.email}</td><td>${o.package_name}<br>${o.credits} اعتبار</td><td>${Number(o.amount).toLocaleString('fa-IR')}</td><td>${o.status}</td><td>${o.status==='pending'?`<button onclick="act(${o.id},'approve')">تأیید</button> <button onclick="act(${o.id},'reject')">رد</button>`:'—'}</td></tr>`).join('')}async function act(id,a){await api('/api/orders/'+id+'/'+a,{method:'POST'});load()}async function logout(){await api('/api/auth/logout',{method:'POST'});location.href='/'}load()</script></body></html>
