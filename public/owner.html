<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>پنل مالک | امنا یار</title></head><body><header class="nav"><a class="brand" href="/"><img src="/assets/logo-amnayar.png"><span>امنا یار<small>پنل مالک</small></span></a><div class="nav-actions"><button class="btn primary" onclick="logout()">خروج</button></div></header><main class="dash"><div class="panel"><div class="stat-grid"><div class="stat"><small>کاربران</small><b id="users">—</b></div><div class="stat"><small>استعلام‌ها</small><b id="checks">—</b></div><div class="stat"><small>پیام‌های AI</small><b id="messages">—</b></div></div><p><a class="btn primary" href="/api/owner/export.xlsx">دریافت گزارش Excel</a></p></div><div class="panel" style="margin-top:20px"><h2>مدیریت سامانه</h2><p class="muted">خرید اعتبار در این نسخه حذف شده و استعلام‌ها رایگان و نامحدود هستند.</p><a class="btn soft" href="/ai.html">باز کردن هوش مصنوعی</a></div></main><script>async function api(u,o){const r=await fetch(u,o);return r.json()}async function load(){const s=await api('/api/owner/stats');if(s.error)return location.href='/';users.textContent=s.users;checks.textContent=s.checks;messages.textContent=s.messages}async function logout(){await api('/api/auth/logout',{method:'POST'});location.href='/'}load()</script></body></html>
