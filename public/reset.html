<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>بازیابی رمز | امنا یار</title></head><body><main class="center-page"><div class="modal-box"><img class="reset-logo" src="/assets/logo-amnayar.png"><h1>تنظیم رمز جدید</h1><p>رمز جدید خود را وارد کنید.</p><input id="pw" type="password" placeholder="حداقل ۸ کاراکتر"><button class="btn primary full" onclick="resetPw()">ذخیره رمز جدید</button><p id="msg"></p></div></main><script>async function resetPw(){const token=new URLSearchParams(location.search).get('token');const password=document.getElementById('pw').value;const r=await fetch('/api/auth/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password})});const j=await r.json();document.getElementById('msg').textContent=j.error||'رمز تغییر کرد؛ اکنون می‌توانید وارد شوید.';}</script></body></html>
