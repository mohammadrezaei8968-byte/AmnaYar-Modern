services:
  - type: web
    name: amnayar-web
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APP_URL
        value: https://amnayar-modern.onrender.com
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
