services:
  - type: web
    name: amnayar-web
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APP_URL
        value: https://amnayar-modern.onrender.com
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-sol
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2
      - key: AI_CREDIT_URL
        value: https://platform.openai.com/settings/organization/billing/overview
      - key: ZARINPAL_MERCHANT_ID
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
